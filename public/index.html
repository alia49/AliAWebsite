    <!-- Apply the saved theme before first paint (no flash). Mirrors src/lib/theme.js. -->
    <script>
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem('theme');
          dark =
            saved === 'dark' ||
            ((saved === null || saved === 'system') &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0a0a0b' : '#ffffff');
      })();
    </script>
    <style>
      html { background: #ffffff; color: #0a0a0a; }
      html.dark { background: #0a0a0b; color: #f4f4f5; }
    </style>
